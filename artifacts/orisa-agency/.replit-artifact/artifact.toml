kind = "web"
previewPath = "/"
title = "Orisa Agency"
version = "1.0.0"
id = "artifacts/orisa-agency"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23873

[services.development]
run = "pnpm --filter @workspace/orisa-agency run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orisa-agency", "run", "build" ]
publicDir = "artifacts/orisa-agency/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23873"
BASE_PATH = "/"
